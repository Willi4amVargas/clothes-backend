services:
  redis:
    image: redis:8.8-alpine
    container_name: erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Comando para iniciar Redis con persistencia activa y contraseña
    command: redis-server --save 60 1 --loglevel warning --requirepass "Admin1234"

volumes:
  redis_data:
