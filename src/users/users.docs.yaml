paths:
  /profile:
    get:
      tags:
        - Autenticación
      description: Muestra la informacion del usuario logeado actualmente
      responses:
        200:
          description: Informacion del usuario
        500:
          description: Error interno del servidor
      security:
        - bearerAuth: []
  /profile_update:
    post:
      tags:
        - Autenticación
      description: Actualiza el perfil del usuario
      requestBody:
        description: Datos para actualizar el perfil del usuario (UpdateUserDto). Todos los campos son opcionales.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: integer
                  minimum: 0
                  description: El ID del rol de perfil asignado al usuario.
                code:
                  type: string
                  minLength: 2
                  description: Código o identificador único del usuario.
                password:
                  type: string
                  minLength: 2
                  description: La nueva contraseña para el usuario.
                description:
                  type: string
                  minLength: 2
                  description: El nombre o descripción del usuario.
                email:
                  type: string
                  format: email
                  description: La dirección de correo electrónico del usuario.
                status:
                  type: boolean
                  description: Estado de activación del usuario (true = activo, false = inactivo).
              example:
                description: "Jane Doe"
                email: "jane.doe@example.com"
                status: true
      # --- END OF REQUEST BODY DOCS ---
      responses:
        200:
          description: Perfil actualizado
        400:
          description: Error de validación en los datos enviados (Bad Request)
        401:
          description: No autorizado, token inválido o faltante
        404:
          description: Usuario logeado no encontrado
        500:
          description: Error interno del servidor
      security:
        - bearerAuth: []
